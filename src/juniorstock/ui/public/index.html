<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>JuniorStock // Web3 Quant Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #e5e5e5; }
    .ticker-tape { animation: ticker 20s linear infinite; white-space: nowrap; }
    @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  
  <div class="border-b border-white/10 bg-black">
    <div class="px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-amber-400 rounded flex items-center justify-center text-black font-bold">JS</div>
        <div>
          <div class="text-xl font-bold tracking-tighter">JuniorStock</div>
          <div class="text-[10px] text-amber-400">WEB3 / QUANT NODE [WS: CONNECTED]</div>
        </div>
      </div>
      <button onclick="connectWallet()" id="wallet-btn" class="bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded text-xs transition flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-500" id="wallet-dot"></span> CONNECT WALLET (ETH/SOL)
      </button>
    </div>
    <div class="border-t border-white/5 bg-zinc-900/50 py-1 text-[10px] overflow-hidden flex">
        <div class="ticker-tape text-emerald-400">
            BTC/USD 142,305.10 (+2.4%) • ETH/USD 6,102.40 (+1.1%) • SOL/USD 245.90 (+5.6%) • SPY 610.25 (+0.4%) • QQQ 512.10 (+0.8%)
        </div>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <div class="w-80 bg-zinc-950 border-r border-white/10 p-4 flex flex-col">
      <div class="text-xs text-white/40 mb-2">QUANT TERRAFORMER</div>
      <textarea id="prompt" rows="5" 
        class="w-full bg-black border border-white/20 rounded p-3 text-xs focus:border-amber-400 outline-none mb-3"
        >Generate a live L2 Order Book component for SOL/USDC. Include depth bars and spread calculation.</textarea>
      <button onclick="sendRequest()" class="bg-amber-400 hover:bg-amber-500 text-black font-bold py-2 rounded text-xs transition">
        TERRAFORM COMPONENT
      </button>
      <div id="log" class="mt-4 text-[10px] text-amber-400/80 bg-black/60 p-3 rounded h-full overflow-y-auto whitespace-pre-wrap">System Online.</div>
    </div>

    <div class="flex-1 p-6 overflow-y-auto bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-zinc-900 to-black" id="canvas">
        <div class="text-center text-white/20 mt-32 text-sm">[ CANVAS EMPTY ]</div>
    </div>
  </div>

  <script>
    const ws = new WebSocket("ws://127.0.0.1:8080/ws/quant");
    const log = document.getElementById('log');
    
    ws.onmessage = e => {
        const d = JSON.parse(e.data);
        if (d.type === "status") { log.innerHTML += `\n> ${d.message}`; log.scrollTop = log.scrollHeight; }
        if (d.type === "board") {
            document.getElementById('canvas').innerHTML = d.html;
            log.innerHTML += `\n> [SUCCESS] Component Mounted.`;
            log.scrollTop = log.scrollHeight;
        }
    };

    function sendRequest() {
        const req = document.getElementById('prompt').value;
        if(req) ws.send(JSON.stringify({action: "terraform", request: req}));
    }

    async function connectWallet() {
        if(window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            document.getElementById('wallet-btn').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> ${accounts[0].slice(0,6)}...`;
            log.innerHTML += `\n> Web3 Wallet Connected: ${accounts[0].slice(0,6)}`;
        } else {
            alert("No Web3 provider detected.");
        }
    }
  </script>
</body>
</html>
