<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuniorStock Audit API</title>
    <style>
        body {
            background-color: #0d0f14;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: #131722;
            border: 1px solid #2a2e39;
            padding: 20px;
            border-radius: 6px;
        }
        h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #787b86;
            margin-top: 0;
        }
        .data-point {
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            color: #2962ff;
        }
        #terminal-out {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            border-radius: 4px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>System Telemetry</h2>
        <div>Power Envelope: <span id="power" class="data-point">--</span></div>
        <div>TDA Betti Signature: <span id="betti" class="data-point">--</span></div>
    </div>
    
    <div class="panel">
        <h2>Hardware Macro Passthrough</h2>
        <div>ATmega32u4 Status: <span id="status" class="data-point">--</span></div>
    </div>

    <div id="terminal-out">
        > JuniorStock UI initialized... Waiting for WebSocket stream...
    </div>

    <script>
        const ws = new WebSocket(`ws://${location.host}/ws/audit`);
        const powerEl = document.getElementById('power');
        const bettiEl = document.getElementById('betti');
        const statusEl = document.getElementById('status');
        const term = document.getElementById('terminal-out');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            powerEl.innerText = data.power_draw;
            bettiEl.innerText = JSON.stringify(data.tda_betti_state);
            statusEl.innerText = data.macro_automata_status;
            
            term.innerHTML += `<br>> [TENSOR STREAM INGESTED] b1.58 Loop Stable. State: ${data.tda_betti_state}`;
            term.scrollTop = term.scrollHeight;
        };
    </script>
</body>
</html>
