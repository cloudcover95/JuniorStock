[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juniorstock"
version = "5.0.0"
description = "Sovereign Quant Trading SDK & KPZ Tensor Engine"
authors = [{name = "JuniorCloud LLC"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "yfinance>=0.2.40",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mlx>=0.10.0"
]

[project.optional-dependencies]
hardware = ["pyserial", "adafruit-circuitpython-hid"]
dev = ["pytest", "ruff", "black"]
