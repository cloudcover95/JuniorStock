# path: pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juniorstock"
version = "6.3.0"
description = "Sovereign Quant Trading SDK & KPZ Tensor Engine"
authors = [{name = "JuniorCloud LLC"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'"
]

[project.optional-dependencies]
apple_silicon = [
    "mlx>=0.10.0",
    "mlx-lm>=0.1.0"
]
hardware = [
    "pyserial"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "build>=1.1.1"
]
full = [
    "bitnet-mlx",
    "crispy-mouse"
]

[tool.hatch.build.targets.wheel]
packages = ["src/juniorstock"]
