[project]
name = "juniorstock"
version = "0.2.0"
description = "Sovereign Edge-Native Multi-Agent Quantitative Trading Orchestrator"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2",
    "numpy",
    "pyarrow",
]

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm"]
cluster = ["ray[default]>=2.10"]
# Real JuniorCloud ecosystem packages (install from sibling repos or PyPI when published)
full = [
    "bitnet-mlx",
    "crispy-mouse",
    "junior-memsys",
    "junior-quant",
]

[project.scripts]
juniorstock = "src.juniorstock.engine.orchestrator:main"
juniorstock-daemon = "run_swarm_daemon:main"
